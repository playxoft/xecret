# The xecret GitHub Action: install the CLI, ready for `xecret run`.
#
#   - uses: playxoft/xecret@v1
#   - run: xecret run -- npm run build
#     env:
#       XECRET_TOKEN: ${{ secrets.XECRET_TOKEN }}
#
# A composite action rather than Docker or JavaScript on purpose: composite
# adds the binary to PATH so the *user's* steps run it with their own
# environment intact, it works on every runner OS, and there is no Node
# runtime to keep in date. The download is checksum-verified against the
# release's checksums.txt before anything is executed — the same discipline as
# scripts/install-cli.sh.
#
# The token is deliberately NOT an input of this action. `XECRET_TOKEN`
# belongs in `env:` on the steps that use it, where GitHub masks it and where
# it is visible in exactly the steps that need it — an action input would
# spread it through the workflow context.
name: "xecret"
description: "Install the xecret CLI — open-source, developer-first secret management"
author: "Playxoft"
branding:
  icon: "lock"
  color: "gray-dark"

inputs:
  version:
    description: "CLI version to install, e.g. v1.2.3. Defaults to the latest release."
    required: false
    default: "latest"

outputs:
  version:
    description: "The version that was installed."
    value: ${{ steps.install.outputs.version }}

runs:
  using: "composite"
  steps:
    - id: install
      shell: bash
      run: |
        set -euo pipefail

        REPO="playxoft/xecret"
        VERSION="${{ inputs.version }}"

        if [ "$VERSION" = "latest" ]; then
          VERSION="$(curl -fsSL "https://api.github.com/repos/${REPO}/releases/latest" \
            | grep -m1 '"tag_name"' | cut -d'"' -f4)"
        fi
        test -n "$VERSION"

        case "$(uname -s)" in
          Linux)  OS=linux ;;
          Darwin) OS=darwin ;;
          *) echo "unsupported OS: $(uname -s)" >&2; exit 1 ;;
        esac
        case "$(uname -m)" in
          x86_64|amd64)  ARCH=amd64 ;;
          arm64|aarch64) ARCH=arm64 ;;
          *) echo "unsupported architecture: $(uname -m)" >&2; exit 1 ;;
        esac

        BARE_VERSION="${VERSION#v}"
        ARCHIVE="xecret_${BARE_VERSION}_${OS}_${ARCH}.tar.gz"
        BASE="https://github.com/${REPO}/releases/download/${VERSION}"

        WORKDIR="$(mktemp -d)"
        trap 'rm -rf "$WORKDIR"' EXIT

        curl -fsSL -o "$WORKDIR/$ARCHIVE" "$BASE/$ARCHIVE"
        curl -fsSL -o "$WORKDIR/checksums.txt" "$BASE/checksums.txt"

        # Verify before unpacking. A tampered archive must fail here, not run.
        (cd "$WORKDIR" && grep " ${ARCHIVE}\$" checksums.txt | sha256sum -c -)

        INSTALL_DIR="${RUNNER_TEMP}/xecret-bin"
        mkdir -p "$INSTALL_DIR"
        tar -xzf "$WORKDIR/$ARCHIVE" -C "$INSTALL_DIR" xecret
        chmod +x "$INSTALL_DIR/xecret"

        echo "$INSTALL_DIR" >> "$GITHUB_PATH"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

        "$INSTALL_DIR/xecret" version
