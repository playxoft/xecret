name = "xecret"
main = ".open-next/worker.js"

# nodejs_compat is required by the OpenNext adapter and by postgres.js (ADR 0006).
compatibility_date = "2026-08-05"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Cloudflare's own log tail. Kept on even though lines are also shipped to
# Better Stack: this is what `wrangler tail` reads, and it is the only thing
# that still works when the shipping pipeline is itself the outage.
[observability]
enabled = true
head_sampling_rate = 1

# Non-secret configuration only. Anything sensitive lives in Phase.dev and is
# pushed to Cloudflare at deploy time — never in this file, which is committed.
[vars]
XECRET_ENV = "development"
XECRET_PUBLIC_URL = "http://localhost:3030"
# The root key version new wrapping operations use. Bumped as step 4 of the
# rotation runbook in docs/security/key-recovery.md, only after the new key
# is present in XECRET_ROOT_KEYS.
XECRET_ROOT_KEY_VERSION = "1"
# The WorkOS *Staging* environment, the same one env.staging uses: local
# development signs in against staging's user pool and never production's. It
# pairs with the Staging environment's WORKOS_API_KEY, and the Staging
# environment must list http://localhost:3030/api/auth/callback as a redirect
# URI. The note on the production value below says why this is a var at all.
WORKOS_CLIENT_ID = "client_01M36CECEQ1FY9TA1F952FY958"

# ── production ──────────────────────────────────────────────────────────────
#
# Named environments inherit `main`, `assets` and compatibility settings, but
# NOT `vars` and NOT bindings — everything below is therefore stated in full,
# even where it repeats the top level.
#
# TOML is order-sensitive in a way the JSON this replaced was not: every key
# written bare below belongs to the table most recently opened. So the scalar
# keys and inline arrays of `[env.production]` come first, and the sub-tables
# (`vars`, and the array-of-tables blocks) come after. Adding a bare key beneath
# one of those blocks silently attaches it to the wrong table.
[env.production]
name = "xecret-production"
routes = [{ pattern = "xecret.playxoft.com", custom_domain = true }]

# ADR 0006 — pooled path to Neon, created by scripts/deploy-bootstrap.sh
# against the DIRECT endpoint (Hyperdrive pools; pgbouncer must not).
hyperdrive = [{ binding = "HYPERDRIVE", id = "c9733ac7b6104546ac59ec53df58a948" }]

[env.production.vars]
XECRET_ENV = "production"
XECRET_PUBLIC_URL = "https://xecret.playxoft.com"
XECRET_ROOT_KEY_VERSION = "1"
# The WorkOS *Production* environment's client id (see
# docs/adr/0010-workos-as-identity-provider.md). Not a secret: it is in every
# authorization URL a browser is sent to. It is stated here, per environment,
# because it names WHICH WorkOS environment this deployment signs people in
# against, and it has to agree with the WORKOS_API_KEY secret: Production's key
# with this id, Staging's key with the Staging id. The key's format does not say
# which environment issued it, so the pairing is checked in the WorkOS
# dashboard. A key from one environment and a client id from the other fails
# every sign-in in a way that reads like a code bug and is not. The redirect
# URI is configured nowhere: it is derived from XECRET_PUBLIC_URL
# (`server/workos.ts`), and must be registered in the WorkOS dashboard as
# exactly https://xecret.playxoft.com/api/auth/callback.
WORKOS_CLIENT_ID = "client_01M36CECX3Z66Q2FYY2FN8WG73"
# Transactional mail. Neither of these is a credential: the address is stamped
# on every message xecret sends and the name sits beside it in the inbox. The
# token that authorises sending is not here — see the foot of this file.
#
# They are declared here rather than set by hand in the dashboard because
# `wrangler deploy` REPLACES a Worker's plaintext vars with exactly this table.
# A var added in the dashboard survives until the next deploy and then vanishes,
# which is a failure that arrives hours later and looks like something else.
ZEPTOMAIL_FROM_ADDRESS = "no-reply-xecrets@mail.playxoft.com"
ZEPTOMAIL_FROM_NAME = "Xecret"
# Zoho runs one host per data centre and a token is only valid at the one that
# issued it. `mail.ts` defaults to the US host when this is unset, which is what
# this deployment had been relying on — correctly, as it turns out, but by
# omission rather than by decision. Verified rather than assumed: the same token
# is accepted here (201, "Email request received") and refused by the EU and
# India hosts (401, "Invalid API Token found").
#
# Stated so that the next person moving this account, or standing up a second
# deployment in another region, changes a line that is already here instead of
# discovering that mail fails in a way nothing reports. `check:deploy` warned
# about the omission on every run; an unanswered warning is one that eventually
# gets read past.
ZEPTOMAIL_API_URL = "https://api.zeptomail.com/v1.1/email"

# ADR 0002 — the Root KEK map. Sourced from Phase.dev, pushed to the
# account's default Secrets Store by scripts/deploy-bootstrap.sh.
[[env.production.secrets_store_secrets]]
binding = "XECRET_ROOT_KEYS"
store_id = "73e054dfa82f45ddb60cd4781d8e64e3"
secret_name = "XECRET_ROOT_KEYS"

# Abuse control, per-colo (see docs/architecture/api.md §6).
[[env.production.ratelimits]]
name = "RL_LOGIN"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[[env.production.ratelimits]]
name = "RL_CLI_TOKEN"
namespace_id = "1002"
simple = { limit = 10, period = 60 }

[[env.production.ratelimits]]
name = "RL_INVITE"
namespace_id = "1003"
simple = { limit = 20, period = 60 }

[[env.production.ratelimits]]
name = "RL_SECRET_READ"
namespace_id = "1004"
simple = { limit = 120, period = 60 }

[[env.production.ratelimits]]
name = "RL_SERVICE"
namespace_id = "1005"
simple = { limit = 600, period = 60 }

[[env.production.ratelimits]]
name = "RL_MUTATION"
namespace_id = "1006"
simple = { limit = 60, period = 60 }

# Generous: a debounced form issues one of these per pause in typing, and each
# is a single indexed lookup. Tight enough that it is not a free
# namespace-enumeration tool.
[[env.production.ratelimits]]
name = "RL_SLUG_CHECK"
namespace_id = "1007"
simple = { limit = 120, period = 60 }

# The contact form, which is the only unauthenticated write in the product.
# Tight, because every accepted request puts a message in a channel a person
# reads: the unit of abuse here is a message rather than an attempt, and a
# handful an hour from one address covers anybody with a genuine question
# twice over.
[[env.production.ratelimits]]
name = "RL_CONTACT"
namespace_id = "1008"
simple = { limit = 5, period = 3600 }

# ── staging ─────────────────────────────────────────────────────────────────
#
# A stub: no routes and no bindings, so a deploy of it produces a Worker with no
# database and no root key. `lib/site.ts` names `scripts/deploy-web.sh <env>` in
# its error message, and `staging` is the only other <env> — fill this in before
# pointing anyone at it.
[env.staging]
name = "xecret-staging"

[env.staging.vars]
XECRET_ENV = "staging"
XECRET_PUBLIC_URL = "https://xecret-staging.playxoft.com"
# The WorkOS *Staging* environment, paired with that environment's
# WORKOS_API_KEY. Stated although the rest of this environment is a stub:
# staging used to omit the identity provider's setting altogether, which left
# it the one environment whose sign-in configuration nothing could check.
# `scripts/deploy-web.sh` now refuses to build any environment that does not
# name one.
WORKOS_CLIENT_ID = "client_01M36CECEQ1FY9TA1F952FY958"

# ────────────────────────────────────────────────────────────────────────────
# NOT IN THIS FILE — credentials, and the two ways to hold them
#
#   WORKOS_API_KEY            authenticates every call to WorkOS, including the
#                             code exchange that decides who a sign-in is.
#                             `sk_…`, from the same WorkOS environment as the
#                             WORKOS_CLIENT_ID var above — which its format
#                             does not reveal, so check it in the dashboard
#   WORKOS_COOKIE_PASSWORD    32+ characters; the MAC key for the sign-in state
#                             cookie. Whoever holds it can complete a sign-in
#                             in somebody else's browser
#   ZEPTOMAIL_TOKEN           authorises sending as your domain
#   DISCORD_CONTACT_WEBHOOK_URL  where the contact form posts; the token is a
#                             path segment, so the whole URL is the credential
#   BETTERSTACK_SOURCE_TOKEN  authorises writing into your log stream
#   BETTERSTACK_INGEST_URL    the source's own https://<id>.betterstackdata.com
#   XECRET_LOG_LEVEL          debug | info | warn | error, for an incident
#
# All are plain strings the Worker reads from `process.env`, so they can be set
# per environment without a code change. They are deliberately not `vars` here:
# this file is committed, and is on its way to a public repository. The two
# WorkOS values are the only REQUIRED ones — without either, nobody can sign in
# and the sign-in routes answer 503 — and like the rest they originate in
# Phase.dev, in the environment matching the one being deployed.
#
# Set them with `wrangler secret put <NAME> --env <env>`, which is not merely
# "more secure" — it is the only form that PERSISTS. The two mechanisms behave
# differently on deploy, and the difference is the whole reason this note
# exists:
#
#   [vars] in this file      replaced wholesale on every deploy. A var added in
#                            the dashboard is gone at the next one.
#   wrangler secret put      stored encrypted, carried forward across deploys,
#                            never printed by wrangler or the dashboard.
#
# So anything that must outlive a deploy belongs in one of those two places —
# this table if it is not a credential, `secret put` if it is. The dashboard is
# neither, and a value that lives only there is a value with an expiry date.
#
# `npm run check:deploy` compares Phase.dev, this file and the live Worker and
# names whatever is missing from any of the three.
# ────────────────────────────────────────────────────────────────────────────

# ────────────────────────────────────────────────────────────────────────────
# Creating the resources these bindings point at. wrangler fails a deploy on a
# binding naming a resource that does not exist, so a new environment is filled
# in only once each has been created.
#
#   database (ADR 0006)
#     npx wrangler hyperdrive create xecret-db --connection-string="$DATABASE_URL"
#
#   root key (ADR 0002)
#     The value originates in Phase.dev and is pushed at deploy time. It is
#     NEVER read from Phase.dev at runtime — see docs/adr/0002. The binding name
#     must match the one read in apps/web/src/server/bindings.ts, and the value
#     is the JSON version→key map documented in
#     packages/core/src/crypto/key-provider.ts, produced by `npm run keygen`.
#
#   rate limiting (GA binding, no Redis — see system-architecture.md §6)
#     No resource to create; the namespace_id values are chosen here.
#
# Copy the corresponding block out of [env.production] above rather than from a
# comment — a commented example is the copy that goes stale.
# ────────────────────────────────────────────────────────────────────────────
