version: 2

# Few dependencies, each reviewed. Updates are grouped so review is a
# fortnightly batch rather than a stream of individual PRs that get
# rubber-stamped — rubber-stamped dependency bumps are how supply-chain
# attacks land (threat T8).
#
# The cadence is a cron rather than an interval because Dependabot has no
# fortnightly one: `0 9 1,15 * *` is the 1st and 15th, the closest it can
# express. Security updates ignore this schedule and still arrive
# immediately, which is what makes a slower routine cadence safe to run.
#
# Majors are grouped too. Excluding them produced precisely the stream this
# comment warns about: eslint and @eslint/js are one upgrade that arrived as two
# PRs, and merging either alone leaves the tree on mismatched majors. Grouping
# by toolchain rather than by semver bracket keeps a coupled upgrade in one
# reviewable diff, which is also the only way to see that it does not resolve.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: cron
      cronjob: "0 9 1,15 * *"
    # Raised from 5: four stalled majors were enough to leave a single slot for
    # a production security patch.
    open-pull-requests-limit: 10
    groups:
      # Dependabot assigns a dependency to the first group it matches, so the
      # pattern groups must precede the dependency-type ones below.

      # The lint stack moves as one unit: @eslint/js must match eslint's major,
      # while typescript-eslint, eslint-config-next and the plugins it pulls all
      # carry peer ranges on eslint. A partial bump is never mergeable.
      linting:
        patterns:
          - eslint
          - "@eslint/*"
          - "@eslint-community/*"
          - typescript-eslint
          - "@typescript-eslint/*"
          - eslint-config-next
          - eslint-plugin-*
          - eslint-import-resolver-*
        update-types: [major, minor, patch]

      # typescript-eslint declares a maximum TypeScript version, so TypeScript
      # cannot move without it. @types/node belongs here rather than drifting
      # ahead of the runtime it is supposed to describe.
      typescript:
        patterns:
          - typescript
          - "@types/node"
        update-types: [major, minor, patch]

      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]

      # Minors ride with patches. Held to patch only, a routine production
      # minor was the one thing here that could not land in a group — firebase
      # 12.17 -> 12.18 arrived as its own PR alongside the four batches, which
      # is the stream the header warns about, in the ecosystem where it matters
      # most. Majors stay out: a production major is worth its own diff.
      production:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: gomod
    directory: /cli
    schedule:
      interval: cron
      cronjob: "0 9 1,15 * *"
    groups:
      # golang.org/x/term is built against a matching golang.org/x/sys, which is
      # why sys appears here as an indirect dependency at all. Bumping one and
      # not the other is the mismatched-majors case the header describes.
      golang-x:
        patterns:
          - golang.org/x/*
        update-types: [major, minor, patch]

      # go-keyring is a front end over per-OS backends: wincred on Windows,
      # dbus on Linux. They are its implementation, not our choices, and a
      # go-keyring upgrade normally moves them with it.
      keyring:
        patterns:
          - github.com/zalando/go-keyring
          - github.com/danieljoos/wincred
          - github.com/godbus/dbus/*
        update-types: [major, minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: "0 9 1,15 * *"
    groups:
      # Ungrouped, this ecosystem produced exactly the stream the header warns
      # about: checkout, setup-go and setup-node arrived as three separate PRs
      # for one upgrade — the runner-runtime bump that every action in a job has
      # to make together. Majors are included for that reason.
      actions:
        patterns:
          - actions/*
        update-types: [major, minor, patch]

      # The multi-arch build stack. qemu, buildx and login are used in one job
      # and only together; a partial bump is a combination nobody has run.
      docker:
        patterns:
          - docker/*
        update-types: [major, minor, patch]

      # The release-signing chain: goreleaser builds and calls cosign, syft
      # catalogues what it built, and release.yml verifies the result. What
      # matters when reviewing any of them is whether the chain still holds
      # end to end, which is one question, not three.
      release-signing:
        patterns:
          - goreleaser/*
          - sigstore/*
          - anchore/*
        update-types: [major, minor, patch]

      # Deliberately left out of every group: contributor-assistant runs on
      # `pull_request_target` with `statuses: write` and sees a fork's PR
      # context, which makes it the one action here whose upgrade should arrive
      # alone and be read on its own terms rather than batched with routine
      # SHA bumps. See the note at the top of cla.yml.
