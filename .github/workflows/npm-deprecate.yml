# One-off: mark the unscoped package names as deprecated.
#
# The first release published four packages as `xecret-*` before npm refused
# the fifth with "Package name triggered spam detection". Everything moved to
# `@playxoft/*` in v0.1.1, which left those four stranded on the registry -
# installable, un-unpublishable after 72 hours, and pointing nowhere.
#
# Deprecation is the only remedy npm offers: the package stays, and anyone who
# installs it gets a warning naming its replacement.
#
# `workflow_dispatch` only, and delete this file once it has run. A workflow
# that can reach NPM_TOKEN is a standing capability, and this one has no
# recurring job to justify keeping it.
name: npm deprecate (one-off)

on: workflow_dispatch

permissions:
  contents: read

jobs:
  deprecate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Deprecate the unscoped names
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          for pkg in xecret-darwin-arm64 xecret-darwin-x64 xecret-linux-arm64 xecret-linux-x64; do
            echo "::group::$pkg"
            npm deprecate "$pkg" \
              "Renamed to @playxoft/$pkg. Install @playxoft/xecret instead; this name is no longer published."
            echo "::endgroup::"
          done
