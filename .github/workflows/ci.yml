name: CI

on:
  push:
    branches: [main]
  pull_request:

# Actions are pinned to commit SHAs rather than tags: a tag can be moved to
# point at malicious code, which is a live supply-chain vector (threat T8).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web & packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"
          cache: npm

      # `npm ci` installs strictly from the lockfile. `npm install` could resolve
      # a different tree than was reviewed.
      - run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Production dependencies are what ship to the Worker and must be clean.
      # Dev-only advisories are reported but do not block: drizzle-kit currently
      # pulls a deprecated esbuild loader that npm cannot override. Revisit when
      # drizzle-kit 1.x is stable.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Audit all dependencies (informational)
        run: npm audit || true

  cli:
    name: CLI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version: "1.25"
          # go.mod, not go.sum: the CLI has no third-party dependencies yet, so
          # go.sum does not exist and setup-go would fail resolving the cache key.
          cache-dependency-path: cli/go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      # The CLI must build for every platform we distribute. Catching a
      # Windows-only break at release time is far more expensive than here.
      - name: Cross-compile
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 \
              go build -o /dev/null ./cmd/xecret \
              && echo "  ok  $target" || exit 1
          done

  bundle:
    name: Worker bundle size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Build Worker bundle
        working-directory: apps/web
        run: npx opennextjs-cloudflare build

      # Bundle size on Workers is a hard wall: exceed 10 MB gzipped and deploys
      # stop working entirely. Catching that here is far cheaper than at release.
      - name: Check bundle size against budget
        run: npm run check:bundle

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      # Leaking a credential in a secret manager's own repository would be
      # existential. This gate is not optional.
      - name: gitleaks
        uses: gitleaks/gitleaks-action@83373cf2f8c4db6e24b41c1a9b086bb9619e9cd3 # v2.3.7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
