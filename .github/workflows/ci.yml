name: CI

on:
  push:
    branches: [main]
  pull_request:

# Actions are pinned to commit SHAs rather than tags: a tag can be moved to
# point at malicious code, which is a live supply-chain vector (threat T8).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web & packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # .nvmrc is the single source of truth, so CI, contributors and the
          # engines field in package.json cannot drift apart.
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` installs strictly from the lockfile. `npm install` could resolve
      # a different tree than was reviewed.
      - run: npm ci

      - name: Format
        run: npm run format:check

      # Runs two configs: the root one over packages/ and scripts/, and
      # apps/web's own. Before the root config existed this step covered only
      # apps/web, which meant the envelope-encryption implementation was the
      # single least-linted part of a security product.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # `npm test` runs vitest without --coverage, so the 95/90/95/95 thresholds
      # declared in packages/core/vitest.config.ts would never be evaluated in
      # CI. Without this step they are a comment, not a gate — the same failure
      # mode as the bundle check that once measured a 2 KB entry shim and
      # reported "within budget".
      - name: Enforce coverage thresholds on the security core
        run: npm run test:coverage --workspace @xecret/core

      # Production dependencies are what ship to the Worker and must be clean.
      # Dev-only advisories are reported but do not block: drizzle-kit currently
      # pulls a deprecated esbuild loader that npm cannot override. Revisit when
      # drizzle-kit 1.x is stable.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Audit all dependencies (informational)
        run: npm audit || true

  cli:
    name: CLI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"
          cache-dependency-path: cli/go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      # The CLI must build for every platform we distribute. Catching a
      # Windows-only break at release time is far more expensive than here.
      - name: Cross-compile
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 \
              go build -o /dev/null ./cmd/xecret \
              && echo "  ok  $target" || exit 1
          done

  bundle:
    name: Worker bundle size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # .nvmrc is the single source of truth, so CI, contributors and the
          # engines field in package.json cannot drift apart.
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build Worker bundle
        working-directory: apps/web
        run: npx opennextjs-cloudflare build

      # Bundle size on Workers is a hard wall: exceed 10 MB gzipped and deploys
      # stop working entirely. Catching that here is far cheaper than at release.
      - name: Check bundle size against budget
        run: npm run check:bundle

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Leaking a credential in a secret manager's own repository would be
      # existential. This gate is not optional.
      #
      # We install the gitleaks binary rather than using gitleaks/gitleaks-action.
      # The action is commercially licensed and refuses to run for a GitHub
      # organisation without a paid GITLEAKS_LICENSE: it exits 1 in about six
      # seconds, before it has downloaded gitleaks or read a single commit. This
      # job was red for that reason alone and had never scanned anything. The
      # scanner itself is MIT and carries no such gate.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          cd "$workdir"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -O "${base}/${archive}"
          curl -sSfL -O "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${archive}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "${archive}" gitleaks
          install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # --redact so a finding names the rule, file and line without reprinting
      # the credential into a build log that is far easier to read than the
      # commit it came from.
      - name: gitleaks
        run: gitleaks git . --redact --verbose --exit-code 1
