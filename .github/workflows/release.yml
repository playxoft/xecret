# Releasing the CLI: tag → binaries, archives, Homebrew formula, Docker image,
# checksums, cosign signatures, SBOMs. Everything GoReleaser produces comes
# from `cli/.goreleaser.yaml`; this workflow only supplies the machinery.
#
# Third-party actions are pinned to commit SHAs, not tags — a tag can be moved
# to malicious code after review, a SHA cannot (threat T8, as in ci.yml).
#
# Signing is keyless: cosign obtains a short-lived certificate from Fulcio
# against this workflow's OIDC identity (`id-token: write`), so there is no
# signing key to store, rotate, or leak. Verification pins the certificate to
# this repository's release workflow identity — see docs/cli/install.
#
# The release is created as a DRAFT (see .goreleaser.yaml): a human reads the
# generated notes and presses publish. An unreviewed release of a secrets tool
# is not a convenience worth having.
#
# That gate is why this file has two triggers rather than one:
#
#   push of a v* tag   →  `goreleaser`, which builds everything and leaves a
#                         draft release for review. Nothing is public yet:
#                         `skip_upload: auto` holds the Homebrew formula, and
#                         a draft's assets need a credential to fetch.
#   release published  →  `npm`, which publishes the registry packages built
#                         from that release's own archives.
#
# npm is on the second trigger because the registry has no draft state and no
# meaningful undo: publishing at tag time would put an unreviewed build of a
# secrets tool one `npm install` away, which is exactly what the draft exists
# to prevent.
name: release

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]

permissions:
  # Create the release and push the Homebrew formula.
  contents: write
  # Push ghcr.io/playxoft/xecret.
  packages: write
  # Keyless cosign signing, and npm provenance.
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  goreleaser:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The changelog is generated from history; a shallow clone would
          # produce release notes describing one commit.
          fetch-depth: 0

      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version: "1.25"
          cache-dependency-path: cli/go.sum

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # `sboms:` in .goreleaser.yaml catalogues every archive with syft, and
      # GoReleaser shells out to it rather than bundling it — so without this
      # step the whole release fails after building all six targets, with
      # `exec: "syft": executable file not found in $PATH`. It did, on the
      # first tag ever pushed.
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      # Multi-arch image builds: arm64 layers are produced on an amd64 runner
      # through qemu + buildx.
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          workdir: cli
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pushing the Homebrew formula crosses into playxoft/homebrew-tap,
          # which GITHUB_TOKEN cannot do. A fine-grained PAT with contents:write
          # on that one repository, set as a repo secret before the first
          # release. Absent, GoReleaser fails the brew step and says why.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

  # ── npm ────────────────────────────────────────────────────────────────
  #
  # Seven packages: the `xecret` wrapper, and one per platform holding nothing
  # but the executable, so npm installs exactly the one that matches the
  # machine. No postinstall script, no download at install time — see the note
  # at the top of cli/npm/lib/resolve.js for why that shape and not the usual
  # one.
  #
  # The binaries come from the release's **own archives**, each verified
  # against the `checksums.txt` published beside it — the file cosign signed.
  # So what npm serves is byte-for-byte what GitHub serves, and that is a
  # property anybody can check rather than a claim about our build.
  #
  # That chain only holds if the checksum file is itself authenticated, so the
  # cosign signature over it is verified here before any hash in it is trusted.
  # Without that step `checksums.txt` is just another asset from the same place
  # as the archives, and an attacker able to rewrite one could rewrite both.
  npm:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    # Narrower than the workflow default: this job publishes to npm and needs
    # only to read the release it was triggered by, plus the OIDC token that
    # `npm publish --provenance` signs with.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download the release archives
        run: |
          mkdir -p "${RUNNER_TEMP}/release"
          gh release download "${TAG}" \
            --dir "${RUNNER_TEMP}/release" \
            --pattern 'xecret_*' \
            --pattern 'checksums.txt' \
            --pattern 'checksums.txt.sig' \
            --pattern 'checksums.txt.pem'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}

      # Keyless verification, against the identity that produced the signature:
      # the `goreleaser` job of *this* workflow file, in *this* repository, on
      # the tag being released. A signature from any other workflow, repository
      # or ref fails here rather than being published.
      - name: Verify the cosign signature over checksums.txt
        working-directory: ${{ runner.temp }}/release
        run: |
          cosign verify-blob checksums.txt \
            --signature checksums.txt.sig \
            --certificate checksums.txt.pem \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${TAG}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
        env:
          TAG: ${{ github.event.release.tag_name }}

      - name: Publish to npm
        working-directory: cli/npm
        run: node publish.mjs --version "${TAG}" --archives "${RUNNER_TEMP}/release"
        env:
          TAG: ${{ github.event.release.tag_name }}
          # An automation token from the npm account that owns `xecret`.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
