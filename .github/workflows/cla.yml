# Contributor Licence Agreement.
#
# ADR 0007 makes the CLA load-bearing rather than ceremonial: it is what keeps a
# future move to BSL/FSL, or a commercial exception, legally possible. Without
# it, the moment one external contribution lands the licence can never be
# changed again without tracking down every contributor. That is the whole
# reason this file exists, and the reason it must stay ahead of the first
# merged outside pull request.
#
# ── Why `pull_request_target`, and why that is safe here ──
# A CLA check has to comment on the pull request and set a status on it, which
# needs write permission on the *base* repository — and `pull_request` grants a
# fork's run only read access. `pull_request_target` runs in the base
# repository's context, with its secrets, which is dangerous precisely when a
# workflow checks out and executes the contributor's code.
#
# This one never checks anything out. There is no `actions/checkout` step below
# and no build; the action reads the pull request's metadata through the API and
# writes a signature file. If a step that runs contributor code is ever added
# here, this trigger has to change with it.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

# Least privilege for what the action actually does: read the pull request,
# comment on it, set a commit status, and commit the signature file.
permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

concurrency:
  group: cla-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  cla:
    name: Check or record signature
    runs-on: ubuntu-latest
    steps:
      - name: CLA assistant
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          # The default token is enough because signatures live in this
          # repository. Storing them elsewhere would need a PAT, which is a
          # second secret to rotate for no benefit at this size.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # The action otherwise locks a pull request when it closes - to stop
          # a signature comment being deleted afterwards. It keys on `closed`,
          # not `merged`, so it would also lock every *rejected* pull request
          # and end the discussion on it. Not worth an anti-revocation measure
          # nobody was told about.
          lock-pullrequest-aftermerge: false
          path-to-signatures: ".github/cla-signatures.json"
          path-to-document: "https://github.com/playxoft/xecret/blob/main/CLA.md"
          branch: "main"
          # Every bot account, not three named ones. A bot cannot agree to
          # anything, so a signature it can never give must not block a pull
          # request forever - and an allowlist of three would have done exactly
          # that to the fourth. The action turns a `*` into a regex.
          #
          # This exempts the account, not the work: a human operating a service
          # account, or an agent submitting substantive code, is a signer. If
          # that starts happening, this line is the wrong tool for it.
          allowlist: "*[bot]"
          custom-notsigned-prcomment: >-
            Thanks for this. Before it can be merged, please read
            [the CLA](https://github.com/playxoft/xecret/blob/main/CLA.md) and
            confirm below. It is one comment, once — never again on later pull
            requests.
          custom-pr-sign-comment: "I have read the CLA and I agree to its terms."
          custom-allsigned-prcomment: "All contributors have signed the CLA."
